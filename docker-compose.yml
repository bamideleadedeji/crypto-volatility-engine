version: '3.8'

services:
  luno-engine:
    build: .
    container_name: luno_institutional_engine
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - ENABLE_LIVE_TRADING=FALSE
      - LUNO_API_KEY_ID=${LUNO_API_KEY_ID}
      - LUNO_API_KEY_SECRET=${LUNO_API_KEY_SECRET}
    volumes:
      - .:/app
      - /app/db_backups
      - /app/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
