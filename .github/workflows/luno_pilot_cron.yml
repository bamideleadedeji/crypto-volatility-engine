name: Automated Luno 50/50 Pilot Executer

on:
  schedule:
    # Runs daily at 08:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  run-luno-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Execute Luno Cron Bot
        env:
          LUNO_API_KEY_ID: ${{ secrets.LUNO_API_KEY_ID }}
          LUNO_API_KEY_SECRET: ${{ secrets.LUNO_API_KEY_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python luno_cron_bot.py
