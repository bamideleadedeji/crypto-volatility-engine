name: ICIE Autonomous Institutional Engine

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Enables manual trigger from the GitHub Actions tab

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Luno Institutional Engine
        env:
          LUNO_API_KEY_ID: ${{ secrets.LUNO_API_KEY_ID }}
          LUNO_API_KEY_SECRET: ${{ secrets.LUNO_API_KEY_SECRET }}
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/luno_institutional_engine.py

      - name: Upload Institutional Audit Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icie-audit-logs
          path: |
            institutional_audit.log
            trade_log.csv
          if-no-files-found: ignore
