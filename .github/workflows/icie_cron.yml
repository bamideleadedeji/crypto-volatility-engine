name: ICIE Autonomous Institutional Engine

on:
  schedule:
    # Runs Monday-Saturday at 09:00, 12:00, 15:00, 18:00 UTC (10:00 AM, 1:00 PM, 4:00 PM, 7:00 PM WAT)
    - cron: '0 9,12,15,18 * * 1-6'
  workflow_dispatch: # Enables manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Luno Institutional Engine
        env:
          LUNO_API_KEY_ID: ${{ secrets.LUNO_API_KEY_ID }}
          LUNO_API_KEY_SECRET: ${{ secrets.LUNO_API_KEY_SECRET }}
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/luno_institutional_engine.py

      - name: Persist Institutional Audit Logs to Repository
        if: always()
        run: |
          git config user.name "ICIE Autonomous Node"
          git config user.email "icie-bot@://github.com"
          git add -f trade_log.csv institutional_audit.log || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(audit): update live ICIE execution & audit logs [skip ci]"
            git push
          fi

      - name: Upload Institutional Audit Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icie-audit-logs
          path: |
            institutional_audit.log
            trade_log.csv
          if-no-files-found: ignore
