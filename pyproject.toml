[project]
name = "crypto-volatility-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.32.0",
    "requests==2.31.0",
    "pandas==2.2.0",
    "numpy==1.26.4",
    "scipy==1.12.0",
    "statsmodels==0.14.1",
    "arch==6.3.0",
    "torch==2.2.0",
    "scikit-learn==1.4.0",
    "yfinance==0.2.36",
    "matplotlib==3.8.2",
    "plotly==5.19.0",
    "ccxt==4.2.25"
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
